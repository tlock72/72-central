name: Probe ATP calendar PDF (temporary)
on:
  push:
    branches: [claude/72-rankings-mobile-ui-g5ouo8]
    paths: [.github/workflows/probe2-tmp.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in "https://www.atptour.com/-/media/files/calendar-pdfs/2026/2026-27-atp-challenger-calendar-as-of-15-january-2026-updated.pdf" \
                   "https://www.atptour.com/en/tournaments" "https://www.atptour.com/en/atp-challenger-tour/calendar" \
                   "https://www.atptour.com/-/tournaments/calendar/tour" ; do
            for ua in "72CentralSchedule/1.0 (+https://github.com/tlock72/72-central)" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129 Safari/537.36"; do
              echo "$(curl -s -o /dev/null -w '%{http_code} %{size_download}' -A "$ua" "$u") $u [$ua]"
            done
          done
