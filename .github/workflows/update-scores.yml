name: Update scores
on:
  schedule:
    - cron: "13,43 6-22 * * *"   # every 30 min (at :13 and :43, off GitHub's busy on-the-hour slots), 07:00-23:45 UK summer time
  workflow_dispatch:
    inputs:
      source:
        description: "Who started this run (the backup timer sends 'timer')"
        required: false
        default: manual
concurrency:
  group: update-scores
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/update.py
        env:
          LIVETENNIS_API_KEY: ${{ secrets.LIVETENNIS_API_KEY }}
          SOURCE: ${{ github.event_name == 'schedule' && 'timer' || inputs.source || 'manual' }}
      - name: ITF junior matches (about twice a day, no Claude)
        run: python3 scripts/itf_matches.py
        continue-on-error: true
        timeout-minutes: 8
        env:
          SOURCE: ${{ github.event_name == 'schedule' && 'timer' || inputs.source || 'manual' }}
      - name: Tennis Europe matches (once a day from 07:30 UK, no Claude)
        run: pip install -q beautifulsoup4 && python3 scripts/te_matches.py
        continue-on-error: true
        timeout-minutes: 6
      - name: Save changes
        run: |
          git config user.name "72 Hub updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json players.json $(ls itfm.json te.json 2>/dev/null)
          git diff --cached --quiet && echo "No changes" || (git commit -q -m "Update scores" && git pull -q --rebase && git push)
      - name: Tell Tobey about anything missed (GitHub issue + email)
        if: always()
        continue-on-error: true
        run: python3 scripts/report_gaps.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
