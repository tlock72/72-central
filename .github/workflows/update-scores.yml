name: Update scores
on:
  schedule:
    - cron: "13,43 6-22 * * *"   # every 30 min (at :13 and :43, off GitHub's busy on-the-hour slots), 07:00-23:45 UK summer time
  workflow_dispatch:
    inputs:
      source:
        description: "Who started this run (the timer sends 'timer'; the Monday 07:00 rankings timer sends 'rankings')"
        required: false
        default: manual
concurrency:
  group: update-scores
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main   # always start from the newest data, even if this run waited behind another one
      - id: scores
        run: python3 scripts/update.py
        env:
          LIVETENNIS_API_KEY: ${{ secrets.LIVETENNIS_API_KEY }}
          SOURCE: ${{ github.event_name == 'schedule' && 'timer' || inputs.source || 'manual' }}
          RANKINGS: ${{ inputs.source == 'rankings' && '1' || '0' }}
      - id: itfrank
        name: ITF junior rankings (Mondays 07:00 UK together with ATP/WTA, no Claude)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python3 - <<'PY' && python3 scripts/itf_juniors.py || echo "ITF junior rankings not due"
          import json, os, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          n = datetime.now(ZoneInfo("Europe/London")); d = json.load(open("itf.json"))
          due = (os.environ["RANKINGS"] == "1" or d.get("pending")
                 or (n.weekday() == 0 and n.hour >= 9 and d.get("checked") != n.strftime("%Y-%m-%d")))
          sys.exit(0 if due else 1)
          PY
        env:
          RANKINGS: ${{ inputs.source == 'rankings' && '1' || '0' }}
          FORCE: ${{ inputs.source == 'rankings' && '1' || '0' }}
      - id: scouting
        name: Scouting HQ rankings (checks every 3 hours, rebuilds when a new ranking week is out, no Claude)
        run: python3 scripts/scouting.py
        continue-on-error: true
        timeout-minutes: 10
        env:
          RANKINGS: ${{ inputs.source == 'rankings' && '1' || '0' }}
      - id: itfm
        name: ITF junior matches (about twice a day, no Claude)
        run: python3 scripts/itf_matches.py
        continue-on-error: true
        timeout-minutes: 8
        env:
          SOURCE: ${{ github.event_name == 'schedule' && 'timer' || inputs.source || 'manual' }}
      - id: titles
        name: ITF World Tennis Tour singles titles (once a day from 07:00 UK, from the ITF site, no Claude)
        run: python3 scripts/itf_titles.py
        continue-on-error: true
        timeout-minutes: 9
      - id: te
        name: Tennis Europe matches (once a day from 07:30 UK, no Claude)
        run: pip install -q beautifulsoup4 && python3 scripts/te_matches.py
        continue-on-error: true
        timeout-minutes: 6
      - id: save
        name: Save changes
        run: |
          git config user.name "72 Hub updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json players.json itf.json $(ls titles.json itfm.json te.json scouting.json scouting_history.json 2>/dev/null)
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Update scores"
          if git pull -q --rebase -X theirs; then git push
          else git rebase --abort; echo "Another update saved first - skipping, the next run will catch up"; fi
      - name: Tell Tobey about anything missed (GitHub issue + email)
        if: always()
        continue-on-error: true
        run: python3 scripts/report_gaps.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_JSON: ${{ toJSON(steps) }}
