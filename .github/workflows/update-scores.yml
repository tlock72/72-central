name: Update scores
on:
  schedule:
    - cron: "13,43 6-22 * * *"   # every 30 min (at :13 and :43, off GitHub's busy on-the-hour slots), 07:00-23:45 UK summer time
  workflow_dispatch: {}
concurrency:
  group: update-scores
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/update.py
        env:
          LIVETENNIS_API_KEY: ${{ secrets.LIVETENNIS_API_KEY }}
      - name: Save changes
        run: |
          git config user.name "72 Hub updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json players.json
          git diff --cached --quiet && echo "No changes" || (git commit -q -m "Update scores" && git pull -q --rebase && git push)
