name: ITF junior rankings (weekly)
on:
  schedule:
    # Mondays at about 08:20, 11:20 and 14:20 UK time. The later runs only do anything
    # if an earlier run could not refresh every player.
    - cron: "20 7,10,13 * * 1"
  workflow_dispatch: {}
concurrency:
  group: itf-juniors
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
jobs:
  itf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Read ITF junior rankings (no Claude)
        id: fetch
        run: python3 scripts/itf_juniors.py
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: Fill any players the ITF site would not serve (Claude, only if needed)
        if: steps.fetch.outputs.pending == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "Follow ITF_JUNIORS.md. Only edit itf.json."
          claude_args: |
            --max-turns 80
            --allowedTools "WebSearch,WebFetch,Read,Edit,Bash(python3:*),Bash(date:*),Bash(sleep:*)"
      - name: Save changes
        run: |
          python3 -c "import json; json.load(open('itf.json'))"
          git config user.name "72 Hub updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itf.json
          git diff --cached --quiet && echo "No changes" || (git commit -q -m "Update ITF junior rankings" && git pull -q --rebase && git push)
