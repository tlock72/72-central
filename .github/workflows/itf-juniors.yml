name: ITF junior rankings (weekly)
on:
  schedule:
    # Mondays at about 08:20, 11:20 and 14:20 UK time. The later runs only do anything
    # if an earlier run could not refresh every player.
    - cron: "20 7,10,13 * * 1"
  workflow_dispatch:
    inputs:
      source:
        description: "Who started this run (the backup timer sends 'timer')"
        required: false
        default: manual
concurrency:
  group: itf-juniors
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  itf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Read ITF junior rankings (no Claude)
        id: fetch
        run: python3 scripts/itf_juniors.py
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source != 'timer' && '1' || '0' }}
      - name: Save changes
        run: |
          python3 -c "import json; json.load(open('itf.json'))"
          git config user.name "72 Hub updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itf.json
          git diff --cached --quiet && echo "No changes" || (git commit -q -m "Update ITF junior rankings" && git pull -q --rebase -X theirs && git push)
      - name: Tell Tobey about anything missed (GitHub issue + email)
        if: always()
        continue-on-error: true
        run: python3 scripts/report_gaps.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
