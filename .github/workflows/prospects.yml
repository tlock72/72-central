name: Scouting Corner
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes: new names are looked up straight away, everyone else once a day from 05:00 UK
  workflow_dispatch:          # also started by the Google Sheet when a name is added on the site (optional, see SCOUTING_CORNER.md)
    inputs:
      force:
        description: "Refresh everyone now (even if already refreshed today)"
        type: boolean
        default: false
concurrency:
  group: scouting-corner      # its own queue: it must not hold up the live score updates
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  corner:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - id: corner
        name: Link every prospect across Tennis Europe, ITF and ATP/WTA (free sources, no Claude)
        run: pip install -q beautifulsoup4 && python3 scripts/prospects.py
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
        timeout-minutes: 30
      - id: suggest
        name: Last 12 months of results for the computerised suggestions (once a day each, no Claude)
        continue-on-error: true
        timeout-minutes: 20
        run: python3 scripts/suggest_results.py
      - id: terank
        name: Tennis Europe U14 rankings for Filtered Rankings (checks every 3 hours, rebuilds when a new week is out, no Claude)
        continue-on-error: true
        timeout-minutes: 20
        run: python3 scripts/te_rank_list.py
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
      - name: Save changes
        run: |
          git config user.name "72 Hub updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corner.json $(ls suggest.json terank.json terank_history.json 2>/dev/null)
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Update Scouting Corner"
          if git pull -q --rebase -X theirs; then git push
          else git rebase --abort; echo "Another update saved first - skipping, the next run catches up"; fi
      - name: Tell Tobey about anything to check (GitHub issue + email)
        if: always()
        continue-on-error: true
        run: python3 scripts/report_gaps.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_JSON: ${{ toJSON(steps) }}
