name: Scouting Corner
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes: new names are looked up straight away, everyone else once a day from 05:00 UK
  workflow_dispatch:          # also started by the Google Sheet when a name is added on the site (optional, see SCOUTING_CORNER.md)
concurrency:
  group: scouting-corner      # its own queue: it must not hold up the live score updates
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  corner:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - id: corner
        name: Link every prospect across Tennis Europe, ITF and ATP/WTA (free sources, no Claude)
        run: pip install -q beautifulsoup4 && python3 scripts/prospects.py
        timeout-minutes: 30
      - name: Save changes
        run: |
          git config user.name "72 Hub updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corner.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Update Scouting Corner"
          if git pull -q --rebase -X theirs; then git push
          else git rebase --abort; echo "Another update saved first - skipping, the next run catches up"; fi
      - name: Tell Tobey about anything to check (GitHub issue + email)
        if: always()
        continue-on-error: true
        run: python3 scripts/report_gaps.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_JSON: ${{ toJSON(steps) }}
