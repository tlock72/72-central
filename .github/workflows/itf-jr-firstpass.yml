name: Past ITF junior results - first pass (branch only, temporary)
# Collects the ITF junior draws on this branch before it is merged, so the hourly job on main starts nearly done.
# Collects only (COLLECT_ONLY): the rankings are worked out and checked on main. Delete this file before merging. (restart 2)
on:
  push:
    branches: [claude/beautiful-brahmagupta-g62e7d]
    paths: [.github/workflows/itf-jr-firstpass.yml]
permissions:
  contents: write
concurrency:
  group: itf-jr-firstpass
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v6
      - name: Collect in 25-minute rounds, saving after each (no Claude)
        env:
          COLLECT_ONLY: "1"
          BUDGET: "1500"
        run: |
          git config user.name "72 Hub updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 13); do
            python3 -u scripts/itf_jr_rebuild.py || true
            git add itfjr_rebuild $(ls itfjr_rebuilt.json 2>/dev/null)
            git diff --cached --quiet || { git commit -q -m "Collect past ITF junior results (round $i)"; git pull -q --rebase -X ours || true; git push -q || true; }
            python3 -c "import json,sys; s=json.load(open('itfjr_rebuild/state.json')); r=json.load(open('itfjr_rebuilt.json')); sys.exit(1 if s.get('blockedAt') or r.get('todo')==0 else 0)" || { echo "stopping: done or bot check"; break; }
          done
