name: ESPN feed test (one-off, changes nothing on the site)
on:
  workflow_dispatch:
  push:
    branches: [claude/peaceful-babbage-u5y7e6]
    paths: [scripts/espn_probe.py, .github/workflows/espn-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/espn_probe.py
      - name: Save the findings to this branch (not main)
        run: |
          git config user.name "72 Hub updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -q -m "ESPN feed test results" && git push || echo "nothing to save"
