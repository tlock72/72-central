name: Probe ranking history sources (temporary)
on:
  push:
    branches: [claude/72-rankings-mobile-ui-g5ouo8]
    paths: [.github/workflows/probe-history.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, re, json
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36", "Accept": "*/*"}
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=40) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", "ERR"), str(e)[:200]
          tests = []
          for pg in (1, 33, 40, 45, 60):
              st, b = get(f"https://www.tennisexplorer.com/ranking/atp-men/?date=2025-09-29&page={pg}")
              rows = re.findall(r"<tr[^>]*>(.*?)</tr>", b, re.S)
              rr = [re.sub(r"\s+", " ", r) for r in rows if "rank" in r and "/player/" in r]
              print("PAGE", pg, st, len(rr))
              for r in rr[:2] + rr[-1:]: print("   ", r[:700])
          for u in tests:
              st, b = get(u)
              print("=====", u, "->", st, len(b))
              print(b[:600].replace("\n", " | "))
              if "player.cgi" in u:
                  for m in re.findall(r"(?:src|href)=['\"]([^'\"]+\.js[^'\"]*)", b): print("  script:", m)
                  for m in re.findall(r"var\s+(\w+)\s*=", b)[:60]: print("  var:", m)
              if "jsmatches" in u or "jsfrags" in u:
                  print("TAIL:", b[-600:].replace("\n"," | "))
                  for m in re.findall(r"var\s+(\w+)\s*=", b)[:60]: print("  var:", m)
              if "tennisexplorer" in u and st == 200:
                  i = b.find("Rank"); print("BODY:", re.sub(r"\s+", " ", b[b.find("<tbody"):b.find("<tbody")+3000]))
                  print("PAGER:", re.findall(r"page=(\d+)", b)[-5:], "DATES:", re.findall(r"date=([\d-]+)", b)[:8])
          PY
